name: Discord tooling

on:
  push:
    branches: [main]
    paths: ['discord/**', '.github/workflows/discord-*.yml']
  pull_request:
    paths: ['discord/**', '.github/workflows/discord-*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run format:check
