name: Discord maintenance

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated tasks (publish, help, archive, contributors)
        required: false
        default: publish,help,archive
      dry_run:
        description: Plan only, change nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.DISCORD_AUTOMATION_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::DISCORD_AUTOMATION_TOKEN is not set; nothing to maintain."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: discord
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_TOKEN == 'true'
        run: node discord/src/maintain.mjs
        env:
          TASKS: ${{ github.event.schedule == '17 9 * * *' && 'contributors' || inputs.tasks }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          DISCORD_AUTOMATION_TOKEN: ${{ secrets.DISCORD_AUTOMATION_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
